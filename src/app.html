<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Scroll-reveal styles apply only when scripts run. A failsafe in the layout removes this class if the motion code never starts. */
document.documentElement.classList.add('js-motion');
document.documentElement.style.setProperty('--ivh', (window.innerHeight * 0.01) + 'px');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Programs For You">
<meta name="copyright" content="© 2026 Programs For You. All rights reserved.">
<meta name="theme-color" content="#0b1110">
<meta name="color-scheme" content="dark">
<link rel="preload" href="/fonts/AspektaVF.woff2" as="font" type="font/woff2" crossorigin>
<noscript><style>[data-reveal]{opacity:1!important;transform:none!important}</style></noscript>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
