<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Everyone must accept the Terms of Service before using the site. Runs before paint so there is no flash. */
window.PFY_TOS = '2026-11-20.1';
try { if (localStorage.getItem('pfy-tos') !== window.PFY_TOS) document.documentElement.classList.add('tos-unaccepted'); }
catch (e) { document.documentElement.classList.add('tos-unaccepted'); }
/* Scroll-reveal styles apply only when scripts run. A failsafe in the layout removes this class if the motion code never starts. */
document.documentElement.classList.add('js-motion');
document.documentElement.style.setProperty('--ivh', (window.innerHeight * 0.01) + 'px');
/* The Terms, Privacy Policy and Founders' Agreement can be read before accepting (they show a bar instead of the gate). */
if (/^\/(terms|privacy|founders-agreement)(\.html)?\/?$/.test(location.pathname)) document.documentElement.setAttribute('data-no-gate', '');</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Brady Krupa and Arjun Bhanderi">
<meta name="copyright" content="© 2026 Brady Krupa and Arjun Bhanderi. All rights reserved.">
<meta name="theme-color" content="#0b1110">
<meta name="color-scheme" content="dark">
<link rel="preload" href="/fonts/AspektaVF.woff2" as="font" type="font/woff2" crossorigin>
<noscript><style>[data-reveal]{opacity:1!important;transform:none!important}</style></noscript>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
